<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GolBetPro Elite Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: Arial, sans-serif;
    background:#020617;
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

button{
    background:#22c55e;
    border:none;
    padding:10px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
    margin:10px 0;
}

button:hover{opacity:.85}

.jogo{
    background:#0f172a;
    padding:18px;
    border-radius:12px;
    margin-bottom:20px;
    border:1px solid #1e293b;
}

.status{
    opacity:.8;
    font-size:14px;
}

.analise{
    background:#1e293b;
    padding:12px;
    border-radius:8px;
    margin-top:12px;
}

.forte{color:#22c55e;font-weight:bold}
.medio{color:#facc15;font-weight:bold}
.fraco{color:#ef4444;font-weight:bold}

hr{
    border:1px solid #334155;
}

</style>
</head>

<body>

<h1>⚽ GolBetPro Elite Ultra</h1>

<button onclick="carregarJogos()">🔄 Atualizar Jogos</button>

<div id="jogos">Carregando jogos...</div>

<script>

/* ===============================
CARREGAR JOGOS
=============================== */

async function carregarJogos(){

    try{

        const hoje = new Date().toISOString().split("T")[0];

        const response = await fetch(`/api/jogos?date=${hoje}`);
        const data = await response.json();

        const container = document.getElementById("jogos");
        container.innerHTML = "";

        if(!data.games || data.games.length === 0){
            container.innerHTML = "<p>Nenhum jogo encontrado.</p>";
            return;
        }

        data.games.forEach(game=>{

            const analysis = game.analysis || {};
            const elite = game.eliteUltra || {};

            let classeScore="fraco";

            if(analysis.score >= 80) classeScore="forte";
            else if(analysis.score >= 60) classeScore="medio";

            const div = document.createElement("div");
            div.className="jogo";

            div.innerHTML=`

                <h3>
                    ${game.teams?.home?.name || "Casa"}
                    ${game.goals?.home ?? 0}
                    x
                    ${game.goals?.away ?? 0}
                    ${game.teams?.away?.name || "Fora"}
                </h3>

                <div class="status">
                    ${game.league?.name || ""}
                    - ${game.fixture?.status?.long || ""}
                </div>

                <button onclick="carregarEstatisticas(${game.fixture?.id})">
                    📊 Ver Análise Elite Ultra
                </button>

                <div class="analise">

                    <p>🎯 Prognóstico: ${analysis.prediction || "N/A"}</p>

                    <p>🔥 Confiança:
                        <span class="${classeScore}">
                            ${analysis.confidence || "N/A"}
                        </span>
                    </p>

                    <p>⭐ Score: ${analysis.score?.toFixed(2) || 0}</p>

                    <p>🦓 Risco de Zebra: ${elite.zebraRisk || 1}/5</p>

                    <p>💰 Cashout: ${elite.cashoutAdvice || ""}</p>

                </div>

                <div id="stats-${game.fixture?.id}" class="analise"></div>

            `;

            container.appendChild(div);
        });

    }catch(e){
        console.error(e);
        document.getElementById("jogos").innerHTML=
        "<p>Erro ao carregar jogos</p>";
    }
}

/* ===============================
ESTATÍSTICAS DO JOGO
=============================== */

async function carregarEstatisticas(fixtureId){

    const container = document.getElementById(`stats-${fixtureId}`);

    container.innerHTML="Carregando estatísticas...";

    try{

        const response = await fetch(`/api/estatisticas?fixture=${fixtureId}`);
        const data = await response.json();

        if(!data.response){
            container.innerHTML="Sem estatísticas disponíveis";
            return;
        }

        let totalChutes=0;
        let chutesGol=0;
        let ambasCheck=0;

        data.response.forEach(team=>{

            const stats = team.statistics;

            const shots = Number(
                stats.find(s=>s.type==="Total Shots")?.value || 0
            );

            const shotsGoal = Number(
                stats.find(s=>s.type==="Shots on Goal")?.value || 0
            );

            totalChutes+=shots;
            chutesGol+=shotsGoal;

            if(shotsGoal>=3) ambasCheck++;

            container.innerHTML+=`
                <h4>${team.team.name}</h4>
                <ul>
                    <li>⚽ Chutes: ${shots}</li>
                    <li>🎯 Chutes no gol: ${shotsGoal}</li>
                </ul>
            `;
        });

        let overClasse="fraco";
        let overTexto="Fraco";

        if(totalChutes>=20 || chutesGol>=8){
            overClasse="forte";
            overTexto="Forte";
        }
        else if(totalChutes>=14){
            overClasse="medio";
            overTexto="Moderado";
        }

        let bttsClasse="fraco";
        let bttsTexto="Fraco";

        if(ambasCheck===2){
            bttsClasse="forte";
            bttsTexto="Forte";
        }
        else if(ambasCheck===1){
            bttsClasse="medio";
            bttsTexto="Moderado";
        }

        container.innerHTML+=`
            <hr>

            <h3>📊 Análise GolBetPro</h3>

            <p>Over 2.5:
                <span class="${overClasse}">
                    ${overTexto}
                </span>
            </p>

            <p>Ambas Marcam:
                <span class="${bttsClasse}">
                    ${bttsTexto}
                </span>
            </p>
        `;

    }catch(e){
        container.innerHTML="Erro ao carregar estatísticas";
    }
}

/* ===============================
AUTO UPDATE
=============================== */

carregarJogos();
setInterval(carregarJogos,60000);

</script>

</body>
</html>
