<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>GolBetPro - Jogos ao Vivo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .jogo {
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .status {
      font-size: 14px;
      opacity: 0.8;
    }

    button {
      background: #22c55e;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 20px;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>⚽ GolBetPro - Jogos do Dia</h1>

  <button onclick="carregarJogos()">Atualizar Jogos</button>

  <div id="jogos">
    Carregando jogos...
  </div>

<script>
async function carregarJogos() {
  try {
    const hoje = new Date().toISOString().split("T")[0];

    const response = await fetch(`/api/jogos?date=${hoje}`);

    if (!response.ok) {
      throw new Error("Erro na API");
    }

    const data = await response.json();

    const container = document.getElementById("jogos");
    container.innerHTML = "";

    if (!data.response || data.response.length === 0) {
      container.innerHTML = "<p>Nenhum jogo encontrado.</p>";
      return;
    }

    data.response.forEach(jogo => {

      const div = document.createElement("div");
      div.className = "jogo";

      div.innerHTML = `
        <h3>
          ${jogo.teams.home.name}
          ${jogo.goals.home ?? 0}
          x
          ${jogo.goals.away ?? 0}
          ${jogo.teams.away.name}
        </h3>
        <div class="status">
          Status: ${jogo.fixture.status.long}
        </div>
      `;

      container.appendChild(div);
    });

  } catch (error) {
    console.error(error);
    document.getElementById("jogos").innerHTML =
      "<p>❌ Erro ao carregar jogos.</p>";
  }
}

// Carrega automaticamente ao abrir
carregarJogos();

// Atualiza a cada 60 segundos
setInterval(carregarJogos, 60000);

</script>

</body>
</html>
