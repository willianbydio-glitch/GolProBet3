<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolBetPro Elite Ultra</title>
    <style>
        /* Estilo Dark e Moderno */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #22c55e;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #1e293b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tabs button.active {
            background: linear-gradient(45deg, #22c55e, #16a34a);
        }

        .jogo-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .placar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-badge {
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .analise-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .info-row b { color: #22c55e; }

        .btn-stats {
            display: block;
            width: 100%;
            background: #22c55e;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>⚽ GolBetPro Elite</h1>

    <div class="tabs">
        <button id="btnHoje" class="active" onclick="mostrarAba('hoje')">📅 Hoje</button>
        <button id="btnLive" onclick="mostrarAba('live')">🔴 Ao Vivo</button>
    </div>

    <div id="listaJogos">
        <p style="text-align:center">Carregando dados...</p>
    </div>
</div>

<script>
    let abaAtual = 'hoje';

    function mostrarAba(aba) {
        abaAtual = aba;
        document.getElementById('btnHoje').classList.toggle('active', aba === 'hoje');
        document.getElementById('btnLive').classList.toggle('active', aba === 'live');
        atualizarInterface();
    }

    async function buscarDados() {
        try {
            const url = abaAtual === 'hoje' 
                ? `/api/jogos?date=${new Date().toISOString().split("T")[0]}`
                : `/api/jogos?live=all`;
            
            const response = await fetch(url);
            const data = await response.json();
            
            return data.games || [];
        } catch (e) {
            console.error("Erro na busca:", e);
            return [];
        }
    }

    async function atualizarInterface() {
        const container = document.getElementById('listaJogos');
        const jogos = await buscarDados();

        if (jogos.length === 0) {
            container.innerHTML = `<p style="text-align:center; opacity:0.5">Nenhum jogo encontrado.</p>`;
            return;
        }

        container.innerHTML = jogos.map(game => {
            const analysis = game.analysis || {};
            const elite = game.eliteUltra || {};
            
            return `
                <div class="jogo-card">
                    <div class="placar">
                        <span>${game.teams?.home?.name || 'Casa'}</span>
                        <span style="color:#22c55e">${game.goals?.home ?? 0} x ${game.goals?.away ?? 0}</span>
                        <span>${game.teams?.away?.name || 'Fora'}</span>
                    </div>
                    
                    <span class="status-badge">
                        ${game.fixture?.status?.long || ''} 
                        ${game.fixture?.status?.elapsed ? `(${game.fixture.status.elapsed}')` : ''}
                    </span>

                    <div class="analise-box">
                        <div class="info-row"><span>🎯 Prognóstico:</span> <b>${analysis.prediction || "N/A"}</b></div>
                        <div class="info-row"><span>🔥 Confiança:</span> <b>${analysis.confidence || "N/A"}</b></div>
                        <div class="info-row"><span>⭐ Score:</span> <b>${analysis.score?.toFixed(2) || "0.00"}</b></div>
                        <div class="info-row"><span>🦓 Zebra Risk:</span> <b>${elite.zebraRisk || 1}/5</b></div>
                        <div class="info-row"><span>💰 Cashout:</span> <b>${elite.cashoutAdvice || "N/A"}</b></div>
                    </div>

                    <a href="#" class="btn-stats">📊 Ver Estatísticas</a>
                </div>
            `;
        }).join('');
    }

    // Iniciar e atualizar a cada 1 minuto
    atualizarInterface();
    setInterval(atualizarInterface, 60000);
</script>

</body>
</html>
