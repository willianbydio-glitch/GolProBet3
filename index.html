<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolBetPro - Profissional</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}
.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
button {
    padding: 8px 15px;
    background: #22c55e;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}
.bar-container {
    background: #334155;
    width: 100%;
    height: 20px;
    border-radius: 10px;
    margin: 5px 0;
    overflow: hidden;
}
.bar {
    height: 100%;
    text-align: right;
    padding-right: 5px;
    color: white;
    font-weight: bold;
}
.bar-home { background: #22c55e; }
.bar-draw { background: #facc15; }
.bar-away { background: #ef4444; }
</style>
</head>
<body>

<h1>⚽ GolBetPro</h1>
<p>Jogos ao vivo e do dia com análise gráfica</p>

<button onclick="buscarJogos()">Carregar Jogos</button>

<div id="jogos"></div>

<script>
const BACKEND_URL = "https://gol-pro-bet3-yjk1.vercel.app/api";

async function buscarJogos() {
    let hoje = new Date();
    let dia = hoje.getDate().toString().padStart(2,'0');
    let mes = (hoje.getMonth()+1).toString().padStart(2,'0');
    let ano = hoje.getFullYear();
    hoje = `${ano}-${mes}-${dia}`;

    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "Carregando jogos...";

    try {
        const response = await fetch(`${BACKEND_URL}/jogos?date=${hoje}`);
        const data = await response.json();
        jogosDiv.innerHTML = "";

        data.response
        .filter(jogo => ["NS","1H","2H"].includes(jogo.fixture.status.short))
        .slice(0,20)
        .forEach(jogo => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${jogo.teams.home.name} vs ${jogo.teams.away.name}</h3>
                <p>Status: ${jogo.fixture.status.long}</p>
                <p>Placar: ${jogo.goals.home ?? "-"} x ${jogo.goals.away ?? "-"}</p>
                <button onclick="analisarJogo(${jogo.teams.home.id}, ${jogo.teams.away.id})">
                    Analisar
                </button>
                <div id="analise-${jogo.teams.home.id}" style="margin-top:10px;"></div>
            `;
            jogosDiv.appendChild(card);
        });
    } catch (err) {
        jogosDiv.innerHTML = "Erro ao carregar jogos: " + err.message;
    }
}

async function analisarJogo(homeId, awayId) {
    const analiseDiv = document.getElementById(`analise-${homeId}`);
    analiseDiv.innerHTML = "Analisando...";

    try {
        const league = 39; 
        const season = 2025; 

        const homeRes = await fetch(`${BACKEND_URL}/estatisticas?team=${homeId}&league=${league}&season=${season}`);
        const homeStats = await homeRes.json();

        const awayRes = await fetch(`${BACKEND_URL}/estatisticas?team=${awayId}&league=${league}&season=${season}`);
        const awayStats = await awayRes.json();

        const homeAttack = homeStats.response?.fixtures?.played?.home || 1;
        const homeGoalFor = homeStats.response?.goals?.for?.total?.home || 1;
        const homeGoalAgainst = homeStats.response?.goals?.against?.total?.home || 1;

        const awayAttack = awayStats.response?.fixtures?.played?.away || 1;
        const awayGoalFor = awayStats.response?.goals?.for?.total?.away || 1;
        const awayGoalAgainst = awayStats.response?.goals?.against?.total?.away || 1;

        const expHomeGoals = (homeGoalFor / homeAttack + awayGoalAgainst / awayAttack) / 2;
        const expAwayGoals = (awayGoalFor / awayAttack + homeGoalAgainst / homeAttack) / 2;

        let probHomeWin = Math.round((expHomeGoals / (expHomeGoals + expAwayGoals)) * 100);
        let probAwayWin = Math.round((expAwayGoals / (expHomeGoals + expAwayGoals)) * 100);
        let probDraw = 100 - probHomeWin - probAwayWin;

        const overGoals = (expHomeGoals + expAwayGoals) > 2.5 ? "Over 2.5" : "Under 2.5";

        // HTML gráfico
        analiseDiv.innerHTML = `
            <p><strong>Análise Probabilística:</strong></p>
            <p>Over/Under: ${overGoals}</p>
            <div class="bar-container"><div class="bar bar-home" style="width:${probHomeWin}%">${probHomeWin}% Casa</div></div>
            <div class="bar-container"><div class="bar bar-draw" style="width:${probDraw}%">${probDraw}% Empate</div></div>
            <div class="bar-container"><div class="bar bar-away" style="width:${probAwayWin}%">${probAwayWin}% Visitante</div></div>
        `;
    } catch (err) {
        analiseDiv.innerHTML = "Erro na análise: " + err.message;
    }
}
</script>

</body>
</html>
