<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GolBetPro Elite Ultra</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #020617;
            color: white;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 { text-align: center; font-size: 24px; margin-bottom: 20px; }

        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }

        button {
            background: linear-gradient(45deg, #22c55e, #16a34a);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            flex: 1;
        }

        button:active { transform: scale(0.98); }

        .jogo {
            background: #0f172a;
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 1px solid #1e293b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h3 { margin: 0 0 10px 0; font-size: 18px; text-align: center; }

        .status {
            text-align: center;
            opacity: 0.7;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .analise {
            background: #1e293b;
            padding: 15px;
            border-radius: 14px;
        }

        .analise p { margin: 8px 0; font-size: 14px; }

        .btn-stats {
            display: block;
            width: 100%;
            background: #22c55e;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 15px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>⚽ GolBetPro Elite Ultra</h1>

    <div class="tabs">
        <button onclick="mostrarAba('hoje')">📅 Hoje</button>
        <button onclick="mostrarAba('live')">🔴 Ao Vivo</button>
    </div>

    <div id="jogosHoje">
        <p style="text-align:center; opacity:0.5;">Carregando jogos...</p>
    </div>

    <div id="jogosLive" style="display:none">
        <p style="text-align:center; opacity:0.5;">Buscando partidas ao vivo...</p>
    </div>

    <script>
        // Alternar entre abas
        function mostrarAba(aba) {
            document.getElementById("jogosHoje").style.display = (aba === "hoje") ? "block" : "none";
            document.getElementById("jogosLive").style.display = (aba === "live") ? "block" : "none";
        }

        // Função para criar o HTML de cada card (evita repetição de código)
        function criarCardJogo(game, isLive = false) {
            const analysis = game.analysis || {};
            const elite = game.eliteUltra || {};
            const liveIcon = isLive ? "🔴 " : "";

            return `
                <div class="jogo">
                    <h3>
                        ${liveIcon}${game.teams?.home?.name || "Casa"} 
                        ${game.goals?.home ?? 0} x ${game.goals?.away ?? 0} 
                        ${game.teams?.away?.name || "Fora"}
                    </h3>
                    <div class="status">
                        ${game.league?.name || ""} ${isLive ? '(' + (game.fixture?.status?.elapsed || 0) + ' min)' : ''}<br>
                        ${game.fixture?.status?.long || "Agendado"}
                    </div>
                    <div class="analise">
                        <p>🎯 Prognóstico: <b>${analysis.prediction || "N/A"}</b></p>
                        <p>🔥 Confiança: <b>${analysis.confidence || "N/A"}</b></p>
                        <p>⭐ Score: <b>${analysis.score?.toFixed(2) || "0.00"}</b></p>
                        <p>🦓 Zebra Risk: <b>${elite.zebraRisk || 1}/5</b></p>
                        <p>💰 Cashout: <b>${elite.cashoutAdvice || "Aguardando"}</b></p>
                    </div>
                    <a href="#" class="btn-stats">📊 Ver Estatísticas</a>
                </div>
            `;
        }

        async function carregarDados() {
            try {
                // Nota: Substitua as URLs pelas rotas reais do seu servidor/API
                const resHoje = await fetch('/api/jogos?date=' + new Date().toISOString().split("T")[0]);
                const dataHoje = await resHoje.json();
                
                const resLive = await fetch('/api/jogos?live=all');
                const dataLive = await resLive.json();

                // Renderizar Hoje
                const containerHoje = document.getElementById("jogosHoje");
                containerHoje.innerHTML = "<h2>📅 Jogos de Hoje</h2>";
                if(dataHoje.games?.length > 0) {
                    dataHoje.games.forEach(g => containerHoje.innerHTML += criarCardJogo(g));
                } else {
                    containerHoje.innerHTML += "<p>Nenhum jogo para hoje.</p>";
                }

                // Renderizar Live
                const containerLive = document.getElementById("jogosLive");
                containerLive.innerHTML = "<h2>🔴 Jogos Ao Vivo</h2>";
                if(dataLive.games?.length > 0) {
                    dataLive.games.forEach(g => {
                        if(g.fixture?.status?.short !== "FT") containerLive.innerHTML += criarCardJogo(g, true);
                    });
                } else {
                    containerLive.innerHTML += "<p>Nenhum jogo ao vivo no momento.</p>";
                }

            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        // Início e Atualização Automática (cada 60 segundos)
        carregarDados();
        setInterval(carregarDados, 60000);
    </script>
</body>
</html>
