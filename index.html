<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolBetPro</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}
.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
button {
    padding: 8px 15px;
    background: #22c55e;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}
</style>
</head>
<body>

<h1>⚽ GolBetPro</h1>
<p>Jogos ao vivo e do dia</p>

<button onclick="buscarJogos()">Carregar Jogos</button>

<div id="jogos"></div>

<script>

// URL do seu backend Vercel
const BACKEND_URL = "https://golprobet3.vercel.app/api";

async function buscarJogos() {
    const hoje = new Date().toISOString().split('T')[0];
    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "Carregando jogos...";

    try {
        const response = await fetch(`${BACKEND_URL}/jogos?date=${hoje}`);
        const data = await response.json();

        jogosDiv.innerHTML = "";

        data.response
        .filter(jogo => 
            jogo.fixture.status.short === "NS" || 
            jogo.fixture.status.short === "1H" || 
            jogo.fixture.status.short === "2H"
        )
        .slice(0, 20)
        .forEach(jogo => {

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${jogo.teams.home.name} vs ${jogo.teams.away.name}</h3>
                <p>Status: ${jogo.fixture.status.long}</p>
                <p>Placar: ${jogo.goals.home ?? "-"} x ${jogo.goals.away ?? "-"}</p>
                <button onclick="analisarJogo(${jogo.teams.home.id}, ${jogo.teams.away.id})">
                    Analisar
                </button>
                <div id="analise-${jogo.teams.home.id}" style="margin-top:10px;"></div>
            `;
            jogosDiv.appendChild(card);
        });

    } catch (err) {
        jogosDiv.innerHTML = "Erro ao carregar jogos: " + err.message;
    }
}

async function analisarJogo(homeId, awayId) {
    const analiseDiv = document.getElementById(`analise-${homeId}`);
    analiseDiv.innerHTML = "Analisando...";

    try {
        // Substitua 'league' e 'season' pelos valores reais se quiser análises precisas
        const league = 39; // exemplo: Premier League
        const season = 2025; 

        const homeRes = await fetch(`${BACKEND_URL}/estatisticas?team=${homeId}&league=${league}&season=${season}`);
        const homeStats = await homeRes.json();

        const awayRes = await fetch(`${BACKEND_URL}/estatisticas?team=${awayId}&league=${league}&season=${season}`);
        const awayStats = await awayRes.json();

        // Exemplo simples de análise
        analiseDiv.innerHTML = `
            <p><strong>Análise:</strong></p>
            <p>${homeStats.team?.name ?? 'Time'}: Gols marcados média: ${homeStats?.response?.goals?.for.total.home ?? '-'}</p>
            <p>${awayStats.team?.name ?? 'Time'}: Gols sofridos média: ${awayStats?.response?.goals?.against.total.home ?? '-'}</p>
        `;
    } catch (err) {
        analiseDiv.innerHTML = "Erro na análise: " + err.message;
    }
}

</script>

</body>
</html>
