<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolBetPro - Profissional</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}
.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
button {
    padding: 8px 15px;
    background: #22c55e;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}
</style>
</head>
<body>

<h1>⚽ GolBetPro</h1>
<p>Jogos ao vivo e do dia com análise automática</p>

<button onclick="buscarJogos()">Carregar Jogos</button>

<div id="jogos"></div>

<script>

const BACKEND_URL = "https://golprobet3.vercel.app/api";

// Função para carregar jogos
async function buscarJogos() {
    const hoje = new Date().toISOString().split('T')[0];
    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "Carregando jogos...";

    try {
        const response = await fetch(`${BACKEND_URL}/jogos?date=${hoje}`);
        const data = await response.json();

        jogosDiv.innerHTML = "";

        data.response
        .filter(jogo => ["NS","1H","2H"].includes(jogo.fixture.status.short))
        .slice(0,50)
        .forEach(jogo => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <h3>${jogo.teams.home.name} vs ${jogo.teams.away.name}</h3>
                <p>Status: ${jogo.fixture.status.long}</p>
                <p>Placar: ${jogo.goals.home ?? "-"} x ${jogo.goals.away ?? "-"}</p>
                <button onclick="analisarJogo(${jogo.teams.home.id}, ${jogo.teams.away.id})">
                    Analisar
                </button>
                <div id="analise-${jogo.teams.home.id}" style="margin-top:10px;"></div>
            `;
            jogosDiv.appendChild(card);
        });

    } catch (err) {
        jogosDiv.innerHTML = "Erro ao carregar jogos: " + err.message;
    }
}

// Função para analisar um jogo
async function analisarJogo(homeId, awayId) {
    const analiseDiv = document.getElementById(`analise-${homeId}`);
    analiseDiv.innerHTML = "Analisando...";

    try {
        const league = 39; // exemplo: Premier League
        const season = 2025; 

        // Estatísticas do time da casa
        const homeRes = await fetch(`${BACKEND_URL}/estatisticas?team=${homeId}&league=${league}&season=${season}`);
        const homeStats = await homeRes.json();

        // Estatísticas do time visitante
        const awayRes = await fetch(`${BACKEND_URL}/estatisticas?team=${awayId}&league=${league}&season=${season}`);
        const awayStats = await awayRes.json();

        // Probabilidades simples (apenas exemplo, usando médias de gols)
        const homeGols = homeStats.response?.goals?.for.total.home || 1;
        const awayGols = awayStats.response?.goals?.against.total.home || 1;

        let probHomeWin = Math.min(95, Math.max(5, Math.round(50 + (homeGols - awayGols)*5)));
        let probAwayWin = Math.min(95, Math.max(5, Math.round(50 + (awayGols - homeGols)*5)));
        let probDraw = 100 - probHomeWin - probAwayWin;
        if(probDraw < 5) probDraw = 5;

        // Over/Under simples
        const overGoals = homeGols + awayGols > 2.5 ? "Over 2.5" : "Under 2.5";

        analiseDiv.innerHTML = `
            <p><strong>Análise Probabilística:</strong></p>
            <p>Vitória ${homeStats.team?.name ?? 'Casa'}: ${probHomeWin}%</p>
            <p>Empate: ${probDraw}%</p>
            <p>Vitória ${awayStats.team?.name ?? 'Visitante'}: ${probAwayWin}%</p>
            <p>${overGoals}</p>
        `;

    } catch (err) {
        analiseDiv.innerHTML = "Erro na análise: " + err.message;
    }
}

</script>
</body>
</html>
