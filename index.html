<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolBetPro</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}
.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}
button {
    padding: 8px 15px;
    background: #22c55e;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>
<body>

<h1>⚽ GolBetPro</h1>
<p>Jogos ao vivo e do dia</p>

<button onclick="buscarJogos()">Carregar Jogos</button>

<div id="jogos"></div>

<script>

const API_KEY = "3f052ff910b32e4aefa8fe5fd1063387";

async function buscarJogos() {

    const hoje = new Date().toISOString().split('T')[0];

    const response = await fetch(
        `https://v3.football.api-sports.io/fixtures?date=${hoje}`,
        {
            method: "GET",
            headers: {
                "x-apisports-key": API_KEY
            }
        }
    );

    const data = await response.json();

    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "";

    data.response.slice(0,10).forEach(jogo => {

        jogosDiv.innerHTML += `
            <div class="card">
                <h3>${jogo.teams.home.name} vs ${jogo.teams.away.name}</h3>
                <p>Status: ${jogo.fixture.status.long}</p>
                <p>Placar: ${jogo.goals.home ?? "-"} x ${jogo.goals.away ?? "-"}</p>
            </div>
        `;
    });
}

</script>

</body>
</html>
