<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GolBetPro</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    text-align: center;
    padding: 20px;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
}

button {
    padding: 8px 15px;
    background: #22c55e;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}
</style>

</head>
<body>

<h1>⚽ GolBetPro</h1>
<p>Jogos ao vivo e do dia</p>

<button onclick="buscarJogos()">Carregar Jogos</button>

<div id="jogos"></div>

<script>

const API_KEY = "3f052ff910b32e4aefa8fe5fd1063387";

async function buscarJogos() {

    const hoje = new Date().toISOString().split('T')[0];

    const response = await fetch(
        `https://v3.football.api-sports.io/fixtures?date=${hoje}`,
        {
            method: "GET",
            headers: {
                "x-apisports-key": API_KEY
            }
        }
    );

    const data = await response.json();

    const jogosDiv = document.getElementById("jogos");
    jogosDiv.innerHTML = "";

    data.response
    .filter(jogo => 
        jogo.fixture.status.short === "NS" || 
        jogo.fixture.status.short === "1H" || 
        jogo.fixture.status.short === "2H"
    )
    .slice(0,20)
    .forEach(jogo => {

        jogosDiv.innerHTML += `
            <div class="card">
                <h3>${jogo.teams.home.name} vs ${jogo.teams.away.name}</h3>
                <p>Status: ${jogo.fixture.status.long}</p>
                <p>Placar: ${jogo.goals.home ?? "-"} x ${jogo.goals.away ?? "-"}</p>

                <button onclick="analisarJogo(${jogo.teams.home.id}, ${jogo.teams.away.id})">
                    Analisar
                </button>

                <div id="analise-${jogo.teams.home.id}" style="margin-top:10px;"></div>
            </div>
        `;
    });
}

async function analisarJogo(homeId, awayId) {

    const responseHome = await fetch(
        `https://v3.football.api-sports.io/fixtures?team=${homeId}&last=5`,
        {
            method: "GET",
            headers: { "x-apisports-key": API_KEY }
        }
    );

    const responseAway = await fetch(
        `https://v3.football.api-sports.io/fixtures?team=${awayId}&last=5`,
        {
            method: "GET",
            headers: { "x-apisports-key": API_KEY }
        }
    );

    const dataHome = await responseHome.json();
    const dataAway = await responseAway.json();

    function calcularMedia(data, teamId) {
        let golsMarcados = 0;
        let golsSofridos = 0;

        data.response.forEach(jogo => {
            if (jogo.teams.home.id === teamId) {
                golsMarcados += jogo.goals.home;
                golsSofridos += jogo.goals.away;
            } else {
                golsMarcados += jogo.goals.away;
                golsSofridos += jogo.goals.home;
            }
        });

        return {
            mediaMarcados: golsMarcados / 5,
            mediaSofridos: golsSofridos / 5
        };
    }

    const homeStats = calcularMedia(dataHome, homeId);
    const awayStats = calcularMedia(dataAway, awayId);

    const probCasa = Math.floor(
        (homeStats.mediaMarcados /
        (homeStats.mediaMarcados + awayStats.mediaMarcados)) * 100
    );

    const mediaTotal = homeStats.mediaMarcados + awayStats.mediaMarcados;

    const btts =
        homeStats.mediaMarcados > 0.8 &&
        awayStats.mediaMarcados > 0.8;

    document.getElementById(`analise-${homeId}`).innerHTML = `
        <p>📊 Vitória Casa: ${probCasa}%</p>
        <p>⚽ Over 2.5: ${mediaTotal > 2.5 ? "Alta Chance" : "Baixa Chance"}</p>
        <p>🔥 Ambas Marcam: ${btts ? "Provável" : "Pouco provável"}</p>
    `;
}

</script>

</body>
</html>
