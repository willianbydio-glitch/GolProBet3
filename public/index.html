<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GolBetPro Elite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #000000;
  color: white;
  padding: 20px;
}

h1 { text-align:center; margin-bottom:20px; }

button {
  background:#22c55e;
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  margin-top:8px;
}

button:hover { opacity:.85; }


.status { font-size:14px; opacity:.8; margin-bottom:10px; }

.estatisticas {
  margin-top:10px;
  background:#334155;
  padding:10px;
  border-radius:6px;
}

.forte { color:#22c55e; font-weight:bold; }
.moderado { color:#facc15; font-weight:bold; }
.fraco { color:#ef4444; font-weight:bold; }

.ranking {
  margin-top:30px;
  padding:15px;
  background:#111827;
  border-radius:8px;
}

hr { border:1px solid #475569; }


  .card-aposta{
 background:#111;
 color:white;
 padding:15px;
 margin-bottom:10px;
 border-radius:10px;
}

.pickIA{
 background:#1b1b1b;
 color:white;
 padding:15px;
 margin-bottom:10px;
 border-radius:10px;
}

.jogo{
 background:#222;
 color:white;
 padding:15px;
 margin-bottom:10px;
 border-radius:10px;
}
</style>
</head>

<body>

<h1>⚽ GolBetPro Elite</h1>

<button onclick="carregarJogos()">Atualizar Jogos</button>
<button onclick="carregarEliteTrader()">🔥 Elite Trader</button>

  <div class="ranking" id="aposta-dia">
  <h2>💎 APOSTA DO DIA</h2>
  <div id="aposta-dia-conteudo">
    Buscando melhor aposta...
  </div>
</div>

<hr>

  <!-- ELITE TRADER -->
<div id="elite-trader" class="ranking">
  <h2>🔥 Elite Trader - Melhores Oportunidades</h2>
  <div id="elite-conteudo"></div>
</div>

<h2>🔥 TOP APOSTAS DO DIA</h2>
<div id="top-apostas"></div>

<hr>

<h2>🧠 PICKS DA IA</h2>
<div id="picksIA"></div>

<hr>

<h2>⚽ JOGOS ANALISADOS</h2>
<div id="jogos">Carregando jogos...</div>

<hr>



<hr>

<div class="ranking">
  <h2>🏆 Ranking Global Inteligente</h2>
  <div id="ranking"></div>
</div>


<script>
let rankingGlobal = [];

async function carregarJogos(){

  try{

    const hoje = new Date().toISOString().split("T")[0];

    const response = await fetch(
      `https://keen-grace-production.up.railway.app/api/jogos?date=${hoje}`
    );

    if (!response.ok) {
      throw new Error("Backend não respondeu");
    }

    const data = await response.json();

    const container = document.getElementById("jogos");
    container.innerHTML = "";

    if(!data.success || !data.response){
      container.innerHTML = "<p>Nenhum jogo encontrado.</p>";
      return;
    }

    const campeonatos = Object.values(data.response);

    if(campeonatos.length === 0){
      container.innerHTML = "<p>Nenhum jogo encontrado.</p>";
      return;
    }

    campeonatos.forEach(camp => {

      const titulo = document.createElement("h2");
      titulo.innerText = `🏆 ${camp.league.name} - ${camp.league.country}`;
      titulo.style.marginTop = "30px";
      container.appendChild(titulo);

      camp.games.forEach(jogo => {

        const div = document.createElement("div");
        div.className = "jogo";

        div.innerHTML = `
          <h3>
            ${jogo.teams.home.name}
            ${jogo.goals.home ?? 0}
            x
            ${jogo.goals.away ?? 0}
            ${jogo.teams.away.name}
          </h3>

          <div>${jogo.fixture.status.long}</div>

          <button onclick="carregarEstatisticas(${jogo.fixture.id})">
            📊 Ver Análise
          </button>

          <button onclick="carregarPrognostico(
            ${jogo.teams.home.id},
            ${jogo.teams.away.id},
            ${camp.league.id},
            ${jogo.fixture.id}
          )">
            📈 Ver Prognóstico
          </button>

          <div id="stats-${jogo.fixture.id}" class="estatisticas"></div>
          <div id="prognostico-${jogo.fixture.id}" class="estatisticas"></div>
        `;

        container.appendChild(div);

      });

    });

  }catch(err){
    console.error("Erro real:", err);
    document.getElementById("jogos").innerHTML =
      "<p>Erro ao carregar jogos.</p>";
  }
}


async function carregarApostaDoDia(){

  const container = document.getElementById("aposta-dia-conteudo");
  container.innerHTML = "Calculando melhor aposta...";

  try{

    const response = await fetch(
      "https://keen-grace-production.up.railway.app/api/aposta-dia"
    );

    const data = await response.json();

    if(!data.success){
      container.innerHTML="Nenhuma aposta encontrada.";
      return;
    }

    const pick = data.pick;

    container.innerHTML = `
      <div class="card-aposta" style="background:#020617;">
        <h3>${pick.jogo}</h3>

        <p><strong>Liga:</strong> ${pick.liga}</p>
        <p><strong>Mercado:</strong> ${pick.mercado}</p>

        <p><strong>Odd:</strong> ${pick.odd}</p>
        <p><strong>Probabilidade:</strong> ${pick.probModelo}%</p>

        <p><strong>EV:</strong> ${pick.ev}%</p>
        <p><strong>Edge:</strong> ${pick.edge}%</p>

        <p style="color:#22c55e;font-weight:bold;">
        🔥 MELHOR OPORTUNIDADE DO DIA
        </p>
      </div>
    `;

  }catch(e){
    container.innerHTML="Erro ao calcular aposta.";
  }
}

async function carregarEstatisticas(fixtureId){

  const container = document.getElementById(`stats-${fixtureId}`);
  container.innerHTML = "Carregando estatísticas...";

  try{
    const response = await fetch(
      `https://keen-grace-production.up.railway.app/api/estatisticas?fixture=${fixtureId}`
    );

    if (!response.ok) {
      throw new Error("Backend não respondeu");
    }

    const data = await response.json();

    if(!data.response){
      container.innerHTML = "";
      return;
    }

    container.innerHTML = "";

    let totalChutes=0,
        totalChutesGol=0,
        totalEscanteios=0,
        ambas=0,
        pressaoCasa=0,
        pressaoFora=0;

    data.response.forEach((time,index)=>{

      const shots = Number(
        time.statistics.find(s=>s.type==="Total Shots")?.value || 0
      );

      const shotsOnGoal = Number(
        time.statistics.find(s=>s.type==="Shots on Goal")?.value || 0
      );

      const corners = Number(
        time.statistics.find(s=>s.type==="Corner Kicks")?.value || 0
      );

      totalChutes+=shots;
      totalChutesGol+=shotsOnGoal;
      totalEscanteios+=corners;

      if(shotsOnGoal>=3) ambas++;

      const intensidadeTime =
        (shots*0.5)+(shotsOnGoal*1.5)+(corners*0.3);

      if(index===0) pressaoCasa=intensidadeTime;
      else pressaoFora=intensidadeTime;

      container.innerHTML+=`
        <h4>${time.team.name}</h4>
        <ul>
          <li>Total Chutes: ${shots}</li>
          <li>Chutes no Gol: ${shotsOnGoal}</li>
          <li>Escanteios: ${corners}</li>
        </ul>
      `;
    });

    const intensidadeBase =
      (totalChutes*0.4)+(totalChutesGol*1.4)+(totalEscanteios*0.3);

    const multiplicador =
      1 +
      (totalChutesGol>=6?0.15:0) +
      (totalEscanteios>=8?0.1:0);

    const intensidadeFinal = intensidadeBase*multiplicador;

    const xG =
      (totalChutesGol*0.32)+(totalChutes*0.05);

    let probOver=Math.min(95,(intensidadeFinal/35)*100);
    let probBTTS=Math.min(95,ambas*45);

    let score =
      Math.min(100,
        Math.round((probOver*0.55)+(probBTTS*0.30)+(xG*5))
      );

    let momentum="⚪ Equilibrado";
    let momentumClasse="";

    if(pressaoCasa>pressaoFora*1.4){
      momentum="🏠 Pressão Casa";
      momentumClasse="forte";
    }else if(pressaoFora>pressaoCasa*1.4){
      momentum="✈ Pressão Visitante";
      momentumClasse="forte";
    }else if(totalChutesGol>=7){
      momentum="🔥 Alta Intensidade";
      momentumClasse="moderado";
    }

    let recomendacao="❌ Baixa oportunidade";

    if(score>=80) recomendacao="🔥 ENTRADA FORTE";
    else if(score>=60) recomendacao="⚠ Boa oportunidade";

    rankingGlobal.push({fixtureId,score});
    rankingGlobal.sort((a,b)=>b.score-a.score);

    atualizarRanking();

    container.innerHTML+=`
      <hr>
      <h3>🧠 Motor Elite Adaptativo</h3>
      <p>📈 xG Estimado: <strong>${xG.toFixed(2)}</strong></p>
      <p>Over 2.5: ${probOver.toFixed(0)}%</p>
      <p>BTTS: ${probBTTS.toFixed(0)}%</p>
      <p>⭐ Score Inteligente: <strong>${score}/100</strong></p>
      <p>${momentumClasse?`<span class="${momentumClasse}">${momentum}</span>`:momentum}</p>
      <h3>${recomendacao}</h3>
    `;

  }catch(e){
    container.innerHTML="Erro ao carregar estatísticas.";
  }
}

/* NOVA FUNÇÃO PROGNÓSTICO */
async function carregarPrognostico(homeId, awayId, leagueId, fixtureId){

  const container = document.getElementById(`prognostico-${fixtureId}`);
  container.innerHTML = "Gerando prognóstico...";

  try{

    const response = await fetch(
      `https://keen-grace-production.up.railway.app/api/prognostico-elite?home=${homeId}&away=${awayId}&league=${leagueId}`
    );

    const data = await response.json();

    if(!data.success){
      container.innerHTML="Erro ao gerar prognóstico.";
      return;
    }

    const elite = data.elite;

    container.innerHTML=`
      <hr>
      <h3>📈 Prognóstico Pré-Jogo</h3>

      <p>⚽ Média Gols Esperada: <strong>${elite.expectedGoals}</strong></p>

      <h4>🏆 Resultado</h4>
      <p>Casa → ${elite.probability.homeWin}%</p>
      <p>Empate → ${elite.probability.draw}%</p>
      <p>Fora → ${elite.probability.awayWin}%</p>

      <h4>🔢 Mercados</h4>
      <p>Over 2.5 → ${elite.markets.over25}%</p>
      <p>Under 2.5 → ${elite.markets.under25}%</p>
      <p>BTTS → ${elite.markets.btts}%</p>

      <h4>🎯 Placares Mais Prováveis</h4>
      <p>${elite.topScores[0].score} (${(elite.topScores[0].probability*100).toFixed(1)}%)</p>
      <p>${elite.topScores[1].score} (${(elite.topScores[1].probability*100).toFixed(1)}%)</p>
      <p>${elite.topScores[2].score} (${(elite.topScores[2].probability*100).toFixed(1)}%)</p>
    `;

  }catch(e){
    container.innerHTML="Erro ao carregar prognóstico.";
  }
}

function atualizarRanking(){
  const div=document.getElementById("ranking");
  div.innerHTML="";
  rankingGlobal.slice(0,5).forEach((j,i)=>{
    div.innerHTML+=`<p>${i+1}º - Jogo ${j.fixtureId} ⭐ ${j.score}/100</p>`;
  });
}

  async function carregarEliteTrader(){

  const container = document.getElementById("elite-conteudo");
  container.innerHTML = "Buscando oportunidades...";

  try{

    const hoje = new Date().toISOString().split("T")[0];

    const response = await fetch(
      `https://keen-grace-production.up.railway.app/api/elite-trader?date=${hoje}`
    );

    if (!response.ok) {
      throw new Error("Backend não respondeu");
    }

    const data = await response.json();

    if(!data.success || !data.elitePicks || data.elitePicks.length === 0){
      container.innerHTML = "<p>Nenhuma oportunidade encontrada hoje.</p>";
      return;
    }

    container.innerHTML = "";

    data.elitePicks.forEach(pick => {

      container.innerHTML += `
        <div class="jogo" style="background:#0f172a;">
          <h3>${pick.jogo}</h3>
          <p><strong>Liga:</strong> ${pick.liga}</p>
          <p><strong>Mercado:</strong> ${pick.mercado}</p>
          <p><strong>Odd:</strong> ${pick.odd}</p>
          <p><strong>Prob Modelo:</strong> ${pick.probModelo}%</p>
          <p><strong>EV:</strong> ${pick.ev}%</p>
          <p><strong>Edge:</strong> ${pick.edge}%</p>
          <p><strong>Rating:</strong> ${pick.rating}</p>
          <p><strong>Stake Recomendada:</strong> ${pick.stakeRecomendada}</p>
          <p><strong>Risco:</strong> ${pick.risco}</p>
          ${pick.alerta ? `<p style="color:#facc15; font-weight:bold;">${pick.alerta}</p>` : ""}
        </div>
      `;
    });

  }catch(e){
    console.error(e);
    container.innerHTML = "Erro ao buscar Elite Trader.";
  }
}
  window.onload = () => {

  carregarJogos();
  carregarEliteTrader();
  carregarApostaDoDia();

};

setInterval(carregarJogos,60000);
setInterval(carregarEliteTrader,60000);
</script>
  
<script src="app.js"></script>
  
</body>
</html>
