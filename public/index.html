<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GolBetPro Elite Ultra</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
    font-family: Arial, sans-serif;
    background:#020617;
    color:white;
    padding:30px;
}

/* HEADER */

h1{
    text-align:center;
    margin-bottom:40px;
    font-size:34px;
}

/* TABS */

.tabs{
    text-align:center;
    margin-bottom:30px;
}

button{
    background:linear-gradient(45deg,#22c55e,#16a34a);
    border:none;
    padding:14px 22px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    margin:8px;
    transition:.2s;
    box-shadow:0 0 12px rgba(34,197,94,.25);
}

button:hover{
    transform:scale(1.05);
}

/* CARD JOGO */

.jogo{
    background:#0f172a;
    padding:24px;
    border-radius:20px;
    margin-bottom:26px;

    border:1px solid #1e293b;

    box-shadow:
        0 15px 35px rgba(0,0,0,.5);
}

/* STATUS */

.status{
    opacity:.85;
    font-size:14px;
    margin-bottom:14px;
}

/* ANALISE */

.analise{
    background:#1e293b;
    padding:18px;
    border-radius:16px;
    margin-top:18px;
}

/* CORES */

.forte{color:#22c55e;font-weight:bold}
.medio{color:#facc15;font-weight:bold}
.fraco{color:#ef4444;font-weight:bold}

</style>
</head>

<body>

<h1>⚽ GolBetPro Elite Ultra</h1>

<div class="tabs">
<button onclick="mostrarAba('hoje')">📅 Jogos Hoje</button>
<button onclick="mostrarAba('live')">🔴 Jogos Ao Vivo</button>
</div>

<div id="jogosHoje"></div>
<div id="jogosLive" style="display:none"></div>

<script>

/* ===============================
ABAS
=============================== */

function mostrarAba(aba){

    document.getElementById("jogosHoje").style.display =
        aba === "hoje" ? "block" : "none";

    document.getElementById("jogosLive").style.display =
        aba === "live" ? "block" : "none";
}

/* ===============================
CARREGAR JOGOS HOJE
=============================== */

async function carregarJogos(){

    try{

        const hoje = new Date().toISOString().split("T")[0];

        const response = await fetch(`/api/jogos?date=${hoje}`);
        const data = await response.json();

        const container = document.getElementById("jogosHoje");

        container.innerHTML = "<h2>📅 Jogos Hoje</h2>";

        if(!data.games || data.games.length === 0){
            container.innerHTML += "<p>Nenhum jogo encontrado.</p>";
            return;
        }

        data.games.forEach(game=>{

            const analysis = game.analysis || {};
            const elite = game.eliteUltra || {};

            container.innerHTML += `
            <div class="jogo">

                <h3>
                    ${game.teams?.home?.name || ""}
                    ${game.goals?.home ?? 0}
                    x
                    ${game.goals?.away ?? 0}
                    ${game.teams?.away?.name || ""}
                </h3>

                <div class="status">
                    ${game.league?.name || ""} -
                    ${game.fixture?.status?.long || ""}
                </div>

                <div class="analise">
                    <p>🎯 Prognóstico: ${analysis.prediction || "N/A"}</p>
                    <p>🔥 Confiança: ${analysis.confidence || "N/A"}</p>
                    <p>⭐ Score: ${analysis.score?.toFixed(2) || 0}</p>
                    <p>🦓 Zebra Risk: ${elite.zebraRisk || 1}/5</p>
                    <p>💰 Cashout: ${elite.cashoutAdvice || ""}</p>
                </div>

            </div>
            `;
        });

    }catch(e){
        console.error(e);
    }
}

/* ===============================
CARREGAR AO VIVO
=============================== */

async function carregarJogosLive(){

    try{

        const response = await fetch(`/api/jogos?live=all`);
        const data = await response.json();

        const container = document.getElementById("jogosLive");

        container.innerHTML = "<h2>🔴 Jogos Ao Vivo</h2>";

        if(!data.games || data.games.length === 0){
            container.innerHTML += "<p>Nenhum jogo ao vivo</p>";
            return;
        }

        for(const game of data.games){

            if(game.fixture?.status?.short === "FT") continue;

            const analysis = game.analysis || {};
            const elite = game.eliteUltra || {};

            container.innerHTML += `
            <div class="jogo">

                <h3>
                    🔴 ${game.teams?.home?.name || ""}
                    ${game.goals?.home ?? 0}
                    x
                    ${game.goals?.away ?? 0}
                    ${game.teams?.away?.name || ""}
                </h3>

                <div class="status">
                    ${game.fixture?.status?.long || ""}
                    (${game.fixture?.status?.elapsed || ""} min)
                </div>

                <div class="analise">
                    <p>🎯 Prognóstico: ${analysis.prediction || "N/A"}</p>
                    <p>🔥 Confiança: ${analysis.confidence || "N/A"}</p>
                    <p>⭐ Score: ${analysis.score?.toFixed(2) || 0}</p>
                    <p>🦓 Zebra Risk: ${elite.zebraRisk || 1}/5</p>
                    <p>💰 Cashout: ${elite.cashoutAdvice || ""}</p>
                </div>

            </div>
            `;
        }

    }catch(e){
        console.error(e);
    }
}

/* ===============================
AUTO UPDATE
=============================== */

carregarJogos();
carregarJogosLive();

setInterval(()=>{
    carregarJogos();
    carregarJogosLive();
},60000);

</script>

</body>
</html>
