<script>

function mostrarAba(aba){
    document.getElementById("jogosHoje").style.display =
        aba === "hoje" ? "block" : "none";

    document.getElementById("jogosLive").style.display =
        aba === "live" ? "block" : "none";
}

/* ===============================
RENDER CARD
=============================== */

function criarCard(game, isLive=false){

    const analysis = game.analysis || {};
    const elite = game.eliteUltra || {};

    const home = game.teams?.home?.name || "";
    const away = game.teams?.away?.name || "";

    const homeGoals = game.goals?.home ?? 0;
    const awayGoals = game.goals?.away ?? 0;

    const statusLong = game.fixture?.status?.long || "";
    const elapsed = game.fixture?.status?.elapsed || "";

    const score =
        typeof analysis.score === "number"
        ? analysis.score.toFixed(2)
        : "0.00";

    return `
        <div class="jogo">

            <h3>
                ${isLive ? "🔴" : ""}
                ${home} ${homeGoals} x ${awayGoals} ${away}
            </h3>

            <div class="status">
                ${statusLong}
                ${isLive && elapsed ? `(${elapsed} min)` : ""}
            </div>

            <div class="analise">
                <p>🎯 Prognóstico: ${analysis.prediction || "N/A"}</p>
                <p>🔥 Confiança: ${analysis.confidence || "N/A"}</p>
                <p>⭐ Score: ${score}</p>
                <p>🦓 Zebra Risk: ${elite.zebraRisk ?? 1}/5</p>
                <p>💰 Cashout: ${elite.cashoutAdvice || ""}</p>
            </div>

        </div>
    `;
}

/* ===============================
CARREGAR HOJE
=============================== */

async function carregarJogos(){

    try{

        const hoje = new Date().toISOString().split("T")[0];
        const response = await fetch(`/api/jogos?date=${hoje}`);

        if(!response.ok){
            throw new Error("Erro na API");
        }

        const data = await response.json();

        const container = document.getElementById("jogosHoje");
        container.innerHTML = "<h2>📅 Jogos Hoje</h2>";

        if(!data.games || !Array.isArray(data.games) || data.games.length === 0){
            container.innerHTML += "<p>Nenhum jogo encontrado.</p>";
            return;
        }

        data.games.forEach(game=>{
            container.innerHTML += criarCard(game,false);
        });

    }catch(e){
        console.error("Erro carregarJogos:",e);
    }
}

/* ===============================
CARREGAR LIVE
=============================== */

async function carregarJogosLive(){

    try{

        const response = await fetch(`/api/jogos?live=all`);

        if(!response.ok){
            throw new Error("Erro na API");
        }

        const data = await response.json();

        const container = document.getElementById("jogosLive");
        container.innerHTML = "<h2>🔴 Jogos Ao Vivo</h2>";

        if(!data.games || !Array.isArray(data.games) || data.games.length === 0){
            container.innerHTML += "<p>Nenhum jogo ao vivo</p>";
            return;
        }

        data.games.forEach(game=>{
            if(game.fixture?.status?.short !== "FT"){
                container.innerHTML += criarCard(game,true);
            }
        });

    }catch(e){
        console.error("Erro carregarJogosLive:",e);
    }
}

/* ===============================
INIT
=============================== */

document.addEventListener("DOMContentLoaded",()=>{
    carregarJogos();
    carregarJogosLive();

    setInterval(()=>{
        carregarJogos();
        carregarJogosLive();
    },60000);
});

</script>
